<script>
(function(){
  var p = location.pathname || '/';
  var m = p.match(/^(\/\d+)\//);
  window.__BASE__ = m ? m[1] : '';
  var _f = window.fetch ? window.fetch.bind(window) : null;
  if(_f){ window.fetch = function(u, o){ if(typeof u === 'string' && u.charAt(0) === '/'){ u = window.__BASE__ + u; } return _f(u, o); }; }
  function fixLinks(){
    var els = document.querySelectorAll('a[href^="/static/"], a[href^="/api/"]');
    for(var i=0;i<els.length;i++){ var h = els[i].getAttribute('href'); if(h && h.charAt(0)==='/'){ els[i].href = window.__BASE__ + h; } }
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', fixLinks); } else { fixLinks(); }
})();
</script>

<title>ResumeAuto · 简历智能匹配 — 全行业岗位</title>
<style>
:root { --bg:#070b18; --bg-soft:#0e1530; --card:#131c3a; --line:#25365f; --text:#eaf0fb; --muted:#93a2c4; --brand:#5b8cff; --brand-2:#8b5cf6; --accent:#2dd4bf; --ok:#34d399; --danger:#fb7185; --warn:#fbbf24; --radius:16px; --grad:linear-gradient(135deg,#5b8cff,#8b5cf6 52%,#2dd4bf); }
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(1100px 560px at 82% -8%,rgba(91,140,255,.20),transparent 60%),radial-gradient(900px 520px at -8% 8%,rgba(139,92,246,.18),transparent 55%),var(--bg); color:var(--text); line-height:1.65; -webkit-font-smoothing:antialiased; min-height:100vh; }

/* ── Layout ─────────────────────────── */
.wrap { max-width:1280px; margin:0 auto; padding:28px 20px 80px; }
.page-header { margin-bottom:32px; }
.page-header h1 { font-size:28px; font-weight:800; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.page-header p { color:var(--muted); margin-top:6px; font-size:14px; }

.main-grid { display:grid; grid-template-columns:380px 1fr; gap:24px; align-items:start; }
@media(max-width:900px){ .main-grid { grid-template-columns:1fr; } }

/* ── Left Panel: Resume ─────────────── */
.left-panel { position:sticky; top:24px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
.card-title { font-size:16px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.card-title .icon { width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; }

textarea.resume-input { width:100%; height:260px; background:var(--bg-soft); border:1px solid var(--line); border-radius:12px; padding:16px; color:var(--text); font-size:13.5px; line-height:1.7; resize:vertical; font-family:inherit; outline:none; transition:border-color .2s; }
textarea.resume-input:focus { border-color:var(--brand); }
textarea.resume-input::placeholder { color:var(--muted); opacity:.6; }

.btn-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.btn { padding:9px 18px; border-radius:10px; border:none; cursor:pointer; font-size:13px; font-weight:600; transition:all .2s; white-space:nowrap; }
.btn-primary { background:var(--grad); color:#fff; }
.btn-primary:hover { opacity:.88; transform:translateY(-1px); }
.btn-outline { background:transparent; color:var(--brand); border:1px solid var(--brand); }
.btn-outline:hover { background:rgba(91,140,255,.10); }
.btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
.btn-ghost:hover { color:var(--text); border-color:var(--muted); }

/* Detection Result */
.result-area { margin-top:20px; display:none; }
.result-area.show { display:block; animation:fadeIn .35s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.result-section { margin-bottom:16px; }
.result-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:7px; font-weight:700; }

.badge-row { display:flex; flex-wrap:wrap; gap:8px; }
.badge { display:inline-flex; align-items:center; gap:5px; padding:5px 13px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid; }
.badge-stem { background:rgba(91,140,255,.14); color:#93bbfd; border-color:rgba(91,140,255,.30); }
.badge-hum { background:rgba(139,92,246,.14); color:#c4aefd; border-color:rgba(139,92,246,.30); }
.badge-biz { background:rgba(45,212,191,.14); color:#5eead4; border-color:rgba(45,212,191,.30); }
.badge-art { background:rgba(251,191,36,.14); color:#fcd34d; border-color:rgba(251,191,36,.30); }
.badge-med { background:rgba(251,113,133,.14); color:#fda4af; border-color:rgba(251,113,133,.30); }
.badge-pub { background:rgba(52,211,153,.14); color:#86efac; border-color:rgba(52,211,153,.30); }
.badge-ene { background:rgba(250,204,21,.14); color:#fef08a; border-color:rgba(250,204,21,.30); }
.badge-gen { background:rgba(148,163,184,.14); color:#cbd5e1; border-color:rgba(148,163,184,.30); }

.tag-pill { display:inline-block; padding:3px 11px; background:var(--bg-soft); border-radius:6px; font-size:12px; color:var(--muted); border:1px solid var(--line); }

.profile-summary { background:var(--bg-soft); border-radius:10px; padding:14px; font-size:13px; line-height:1.7; }
.profile-summary strong { color:var(--accent); }

/* ── Right Panel: Platform Cards ─────── */
.right-panel { display:flex; flex-direction:column; gap:24px; }
.section-header { font-size:17px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }

.platform-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
.platform-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; transition:transform .2s,border-color .2s; }
.platform-card:hover { border-color:var(--brand); transform:translateY(-2px); }
.pf-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.pf-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#fff; flex-shrink:0; }
.pf-name { font-size:14px; font-weight:700; }
.pf-desc { font-size:11px; color:var(--muted); }
.link-pills { display:flex; flex-wrap:wrap; gap:8px; }
.link-pill { display:inline-flex; align-items:center; gap:5px; padding:6px 13px; background:var(--bg-soft); border:1px solid var(--line); border-radius:20px; font-size:12.5px; color:var(--text); text-decoration:none; transition:all .2s; }
.link-pill:hover { border-color:var(--brand); background:rgba(91,140,255,.08); color:var(--brand); }
.link-pill .pi { font-size:11px; }

/* Platform icon colors */
.bg-boss { background:linear-gradient(135deg,#00c4cc,#00a8b8); }
.bg-liepin { background:linear-gradient(135deg,#ff6a00,#ff8533); }
.bg-zhilian { background:linear-gradient(135deg,#6366f1,#818cf8); }
.bg-51job { background:linear-gradient(135deg,#10b981,#34d399); }
.bg-lagou { background:linear-gradient(135deg,#ec4899,#f472b6); }
.bg-shixi { background:linear-gradient(135deg,#22c55e,#4ade80); }

/* ── Job List ───────────────────────── */
.job-controls { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.search-box { flex:1; min-width:180px; padding:9px 14px; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:13px; outline:none; }
.search-box:focus { border-color:var(--brand); }
.filter-select { padding:9px 12px; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:13px; outline:none; cursor:pointer; }

.mode-tabs { display:flex; gap:0; margin-bottom:14px; background:var(--bg-soft); border-radius:10px; padding:3px; }
.mtab { flex:1; padding:8px 14px; text-align:center; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); border:none; background:transparent; transition:all .2s; }
.mtab.active { background:var(--grad); color:#fff; }
.mtab:hover:not(.active) { color:var(--text); }

.job-list { display:flex; flex-direction:column; gap:10px; }
.job-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; transition:transform .2s,border-color .2s; position:relative; overflow:hidden; }
.job-card:hover { border-color:var(--brand); transform:translateX(3px); }
.job-card.new-job { border-left:3px solid var(--accent); }
.job-card.updated-job { border-left:3px solid var(--warn); }

.match-bar { width:5px; height:100%; border-radius:3px; position:absolute; left:0; top:0; }
.match-high { background:var(--ok); }
.match-mid { background:var(--warn); }
.match-low { background:var(--danger); }

.job-body { min-width:0; }
.job-title-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.job-title { font-size:15px; font-weight:700; color:var(--text); }
.job-cat-badge { font-size:10.5px; padding:2px 8px; border-radius:8px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.job-meta { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; font-size:12px; color:var(--muted); }
.job-meta span { display:inline-flex; align-items:center; gap:4px; }
.job-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.jtag { font-size:11px; padding:2px 9px; background:var(--bg-soft); border-radius:6px; color:var(--muted); border:1px solid var(--line); }
.job-score { text-align:right; min-width:64px; }
.score-num { font-size:24px; font-weight:800; }
.score-label { font-size:11px; color:var(--muted); margin-top:2px; }
.go-btn { display:inline-flex; align-items:center; gap:5px; margin-top:8px; padding:6px 14px; background:var(--grad); color:#fff; border:none; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; transition:opacity .2s; }
.go-btn:hover { opacity:.85; }

/* Sync status */
.sync-bar { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:8px; }
.sync-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.sync-dot.ok { background:var(--ok); }
.sync-dot.loading { background:var(--warn); animation:pulse 1.2s infinite; }
.sync-dot.err { background:var(--danger); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.live-badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.live-badge .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); animation:pulse 2s infinite; }

.empty-state { text-align:center; padding:48px 20px; color:var(--muted); }
.empty-state .icon { font-size:40px; margin-bottom:12px; }
.toast { position:fixed; bottom:24px; right:24px; padding:14px 22px; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:13.5px; z-index:999; transform:translateY(100px); opacity:0; transition:all .35s; pointer-events:none; }
.toast.show { transform:translateY(0); opacity:1; pointer-events:auto; }

/* Footer badge */
.footer-badge { text-align:center; margin-top:32px; font-size:12px; color:var(--muted); }
</style>
</head>

<div class="wrap">
  <div class="page-header">
    <h1>简历分析 + 全行业匹配投递</h1>
    <p>左：粘贴简历 → 自动识别学科背景（理科/文科/经管/艺术/医学/综合）。右：根据你的背景动态生成各平台搜索链接 + 推荐全行业匹配职位。</p>

  <div class="main-grid">

          <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeResume()">🔍 分析简历并匹配</button>

            <div class="result-label">🧭 求职方向 & 城市</div>
            <div class="profile-summary" id="profileSummary"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Platform Links + Jobs -->
    <div class="right-panel">

      <!-- Platform Quick Links -->
      <div>
        <div class="section-header">🔗 各平台直达搜索（根据你的学科背景动态生成）</div>
        <div class="platform-grid" id="platformGrid">
          <!-- Populated by JS after analysis -->
          <div class="empty-state" style="grid-column:1/-1">
            <div class="icon">📋</div>
            <div>请先在左侧粘贴简历并点击「分析简历」<br><span style="font-size:12px;color:var(--muted)">系统将根据检测到的学科背景，为每个招聘平台生成对应的搜索关键词链接</span></div>
          </div>
        </div>
      </div>

      <!-- Job Recommendations -->
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
          <div class="section-header" style="margin-bottom:0;">💼 匹配职位推荐</div>
          <div class="live-badge"><span class="dot"></span> 数据实时更新 · 最后更新：<b id="dataTs">—</b></div>
        </div>

        <div class="mode-tabs">
          <button class="mtab active" data-mode="recommended" onclick="setMode('recommended')">⭐ 推荐职位</button>
          <button class="mtab" data-mode="all" onclick="setMode('all')">📋 全部职位浏览</button>
        </div>

        <div class="job-controls">
          <input class="search-box" id="searchBox" placeholder="🔍 搜索职位名称、技能、公司..." oninput="renderJobs()">
          <select class="filter-select" id="catFilter" onchange="renderJobs()">
            <option value="">全部类别</option>
          </select>
          <select class="filter-select" id="fieldFilter" onchange="renderJobs()">
            <option value="">全部领域</option>
          </select>
        </div>

        <div class="job-list" id="jobList">
          <div class="empty-state" style="grid-column:1/-1">
            <div class="icon">⏳</div>
            <div>正在加载职位数据...</div>
          </div>
        </div>

        <div class="sync-bar">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncText">等待同步</span>
          <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px;margin-left:auto" onclick="loadJobs(true)">🔄 立即刷新</button>
        </div>
      </div>

    </div>
  </div>

  <div class="footer-badge">
    <span class="live-badge"><span class="dot"></span> 招聘数据实时更新 · 最后更新：<b id="dataTsFooter">—</b></span>
  </div>
</div>

<div class="toast" id="toast"></div>

function detectCategory(text) {
    var t = text.toLowerCase();
    // Score each category
    var scores = { STEM:0, Humanities:0, Business:0, Arts:0, Medical:0 };
    
    // Major-based detection
    if (STEM_MAJORS.test(t)) scores.STEM += 40;
    if (HUM_MAJORS.test(t)) scores.Humanities += 40;
    if (BIZ_MAJORS.test(t)) scores.Business += 40;
    if (ART_MAJORS.test(t)) scores.Arts += 40;
    if (MED_MAJORS.test(t)) scores.Medical += 40;
    
    // Skill keyword overlap
    var stemMatches = t.match(STEM_SKILLS);
    if (stemMatches) scores.STEM += Math.min(stemMatches.length * 3, 30);
    
    var humMatches = t.match(HUM_SKILLS);
    if (humMatches) scores.Humanities += Math.min(humMatches.length * 3, 30);
    
    var bizMatches = t.match(BIZ_SKILLS);
    if (bizMatches) scores.Business += Math.min(bizMatches.length * 3, 30);
    
    var artMatches = t.match(ART_SKILLS);
    if (artMatches) scores.Arts += Math.min(artMatches.length * 3, 30);
    
    var medMatches = t.match(MED_SKILLS);
    if (medMatches) scores.Medical += Math.min(medMatches.length * 3, 30);
    
    // Energy-specific boost
    if (/光伏|风电|储能|氢能|核电|电网|油气|锂电|电池|BMS|逆变器|新能源|碳管理|碳中和|ESG/.test(t)) {
        scores.STEM += 15;
    }
    
    // Find max
    var maxCat = 'General';
    var maxScore = 0;
    for (var k in scores) {
        if (scores[k] > maxScore) { maxScore = scores[k]; maxCat = k; }
    }
    
    // If score too low, default to General
    if (maxScore < 10) maxCat = 'General';
    
    return maxCat;
}

function extractProfile(text) {
    var t = text;
    var category = detectCategory(t);
    
    // Extract skills based on detected category
    var skillRegex = null;
    var allSkills = [];
    switch(category) {
        case 'STEM': skillRegex = STEM_SKILLS; break;
        case 'Humanities': skillRegex = HUM_SKILLS; break;
        case 'Business': skillRegex = BIZ_SKILLS; break;
        case 'Arts': skillRegex = ART_SKILLS; break;
        case 'Medical': skillRegex = MED_SKILLS; break;
        default: skillRegex = STEM_SKILLS;
    }
    var m;
    while ((m = skillRegex.exec(t)) !== null) {
        if (allSkills.indexOf(m[0]) === -1) allSkills.push(m[0]);
    }
    if (allSkills.length === 0) allSkills = ['待识别'];
    
    // Extract directions/intent
    var directions = [];
    var dirMatch = t.match(/(?:求职|意向|方向|目标)[\s:：]*([^\n\r]+)/gi);
    if (dirMatch) {
        dirMatch.forEach(function(d){
            var items = d.replace(/(?:求职|意向|方向|目标)[\s:：]*/,'').split(/[,，、;；\/|]/);
            items.forEach(function(item){ item=item.trim(); if(item && item.length > 1 && item.length < 20) directions.push(item); });
        });
    }
    if (directions.length === 0) directions = ['未指定'];
    
    // Extract city
    var cities = [];
    var cityMatch = t.match(/(?:期望?城市|工作地|地点|base)[\s:：]*([^\n\r]+)/gi);
    if (cityMatch) {
        cityMatch.forEach(function(c){
            var items = c.replace(/(?:期望?城市|工作地|地点|base)[\s:：]*/,'').split(/[,，、;；\/|]/);
            items.forEach(function(item){ item=item.trim(); if(item && item.length > 1 && item.length < 15) cities.push(item); });
        });
    }
    if (cities.length === 0) cities = ['全国'];
    
    // Extract education
    var edu = '未识别';
    var eduMatch = t.match(/(博士|硕士|本科|大专|高中|中专|MBA|EMBA)/);
    if (eduMatch) edu = eduMatch[1];
    
    // Extract experience
    var exp = '未识别';
    var expMatch = t.match(/(\d+?\s*年[\+\~至]?\s*\d*?)\s*(经验|工作|从业|实习)/);
    if (expMatch) exp = expMatch[1] || expMatch[0];
    else if (/应届|毕业生|在校/.test(t)) exp = '应届';
    
    return { category: category, skills: allSkills.slice(0, 15), directions: directions.slice(0, 5), city: cities.slice(0, 5), edu: edu, exp: exp };
}

function analyzeResume() {
    var text = document.getElementById('resumeInput').value.trim();
    if (!text) { showToast('请先粘贴简历内容'); return; }
    
    profile = extractProfile(text);
    
    // Show result area
    var ra = document.getElementById('resultArea');
    ra.classList.add('show');
    
    // Render category badges
    var cc = CAT_CONFIG[profile.category];
    document.getElementById('categoryBadges').innerHTML =
        '<span class="badge ' + cc.cls + '">' + cc.label + '</span>' +
        '<span class="tag-pill" style="margin-left:4px">' + cc.desc + '</span>';
    
    // Render keywords
    var kwHtml = profile.skills.map(function(s){ return '<span class="tag-pill">' + s + '</span>'; }).join('');
    document.getElementById('keywordTags').innerHTML = kwHtml || '<span class="tag-pill">未提取到关键词</span>';
    
    // Render summary
    document.getElementById('profileSummary').innerHTML =
        '<strong>方向：</strong>' + profile.directions.join(' / ') +
        '<br><strong>城市：</strong>' + profile.city.join(' / ') +
        '<br><strong>学历：</strong>' + profile.edu +
        '&nbsp;&nbsp;<strong>经验：</strong>' + profile.exp;
    
    // Generate platform links
    renderPlatformCards(profile.category);
    
    // Re-render jobs with new profile
    renderJobs();
    
    showToast('✅ 学科背景识别完成：' + cc.label);
}

/* ═══════════════════════════════════════════
   PLATFORM CARDS RENDERING
   ═══════════════════════════════════════════ */
function renderPlatformCards(category) {
    var grid = document.getElementById('platformGrid');
    if (!category) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">📋</div><div>请先在左侧粘贴简历并点击「分析简历」<br><span style="font-size:12px;color:var(--muted)">系统将根据检测到的学科背景，为每个招聘平台生成对应的搜索关键词链接</span></div>';
        return;
    }
    
    var keys = PLATFORM_KEYWORDS[category] || PLATFORM_KEYWORDS['General'];
    
    var html = '';
    PLATFORM_INFO.forEach(function(pf) {
        var kwList = keys[pf.key] || keys['boss'];
        var pills = kwList.map(function(kw){
            var url = pf.urlBase.replace('{kw}', encodeURIComponent(kw));
            return '<a class="link-pill" href="' + url + '" target="_blank" rel="noopener noreferrer"><span class="pi">🔗</span>' + kw + '</a>';
        }).join('');
        
        html += '<div class="platform-card">' +
            '<div class="pf-head">' +
                '<div class="pf-icon ' + pf.cls + '">' + pf.name.charAt(0) + '</div>' +
                '<div><div class="pf-name">' + pf.name + '</div><div class="pf-desc">' + pf.desc + '</div></div>' +
            '</div>' +
            '<div class="link-pills">' + pills + '</div>' +
            '</div>';
    });
    
    grid.innerHTML = html;
}

/* ═══════════════════════════════════════════
   JOB MATCHING & RENDERING
   ═══════════════════════════════════════════ */
function computeMatchScore(job) {
    if (!profile) return { score: 50, level: 'mid' }; // No profile = mid match
    
    var score = 0;
    var wSkill = 45, wTitle = 25, wCity = 10, wCat = 10, wEdu = 5, wExp = 5;
    
    // 1. Skill overlap (biggest weight)
    var jobSkills = (job.skills || []).map(function(s){ return s.toLowerCase(); });
    var mySkills = (profile.skills || []).map(function(s){ return s.toLowerCase(); });
    var overlap = 0;
    mySkills.forEach(function(ms){
        jobSkills.forEach(function(js){
            if (ms.indexOf(js) > -1 || js.indexOf(ms) > -1 || ms === js) overlap++;
        });
    });
    var skillRatio = jobSkills.length > 0 ? Math.min(overlap / Math.max(jobSkills.length, 1), 1) : 0;
    score += skillRatio * wSkill;
    
    // 2. Title relevance
    var titleLower = (job.title || '').toLowerCase();
    var dirText = (profile.directions || []).join(' ').toLowerCase();
    var titleHit = 0;
    (profile.directions || []).forEach(function(d){
        if (titleLower.indexOf(d.toLowerCase()) > -1) titleHit++;
    });
    if (titleHit > 0) score += Math.min(titleHit * 8, wTitle);
    
    // 3. Category bonus
    if (job.category === profile.category) score += wCat;
    
    // 4. City match
    var jobCity = (job.city || '').toLowerCase();
    (profile.city || []).forEach(function(c){
        if (jobCity.indexOf(c.toLowerCase()) > -1 || c.toLowerCase().indexOf(jobCity) > -1) { score += wCity; }
    });
    
    // 5. Education
    var eduMap = {'博士':5,'硕士':4,'本科':3,'大专':2,'高中':1};
    var myEduLevel = eduMap[profile.edu] || 2;
    var jobEduLevel = eduMap[job.edu] || 2;
    if (myEduLevel >= jobEduLevel) score += wEdu;
    
    score = Math.round(Math.min(score, 100));
    var level = score >= 65 ? 'high' : (score >= 35 ? 'mid' : 'low');
    return { score: score, level: level };
}

function sigOf(jobs) {
    var parts = jobs.map(function(j){ return j.id + '|' + j.updatedAt + '|' + j.status; });
    parts.sort();
    return parts.join('#');
}

function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mtab').forEach(function(t){ t.classList.toggle('active', t.dataset.mode === mode); });
    renderJobs();
}

function renderJobs() {
    var list = document.getElementById('jobList');
    var search = (document.getElementById('searchBox').value || '').toLowerCase();
    var catFilter = document.getElementById('catFilter').value;
    var fieldFilter = document.getElementById('fieldFilter').value;
    
    var jobs = allJobs.slice();
    
    // Filter
    if (search) {
        jobs = jobs.filter(function(j){
            return (j.title||'').toLowerCase().indexOf(search) > -1 ||
                   (j.field||'').toLowerCase().indexOf(search) > -1 ||
                   (j.company||'').toLowerCase().indexOf(search) > -1 ||
                   (j.tags||[]).some(function(t){ return t.toLowerCase().indexOf(search) > -1; }) ||
                   (j.skills||[]).some(function(s){ return s.toLowerCase().indexOf(search) > -1; });
        });
    }
    if (catFilter) jobs = jobs.filter(function(j){ return j.category === catFilter; });
    if (fieldFilter) jobs = jobs.filter(function(j){ return j.field === fieldFilter; });
    
    // Sort
    if (currentMode === 'recommended' && profile) {
        jobs.sort(function(a, b){ return computeMatchScore(b).score - computeMatchScore(a).score; });
    } else {
        jobs.sort(function(a, b){ return (a.id).localeCompare(b.id); });
    }
    
    if (jobs.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div>没有找到匹配的职位<br><span style="font-size:12px">试试调整筛选条件或搜索关键词</span></div>';
        return;
    }
    
    var html = '';
    jobs.forEach(function(job){
        var ms = computeMatchScore(job);
        var lvlCls = ms.level === 'high' ? 'match-high' : (ms.level === 'mid' ? 'match-mid' : 'match-low');
        var lvlLabel = ms.level === 'high' ? '高度匹配' : (ms.level === 'mid' ? '一般匹配' : '低匹配');
        var lvlColor = ms.level === 'high' ? 'var(--ok)' : (ms.level === 'mid' ? 'var(--warn)' : 'var(--danger)');
        
        var catCfg = CAT_CONFIG[job.category] || CAT_CONFIG['General'];
        
        var tagsHtml = (job.tags || []).slice(0, 5).map(function(t){ return '<span class="jtag">' + t + '</span>'; }).join('');
        var matchedSkills = [];
        if (profile) {
            (profile.skills || []).forEach(function(ps){
                if ((job.skills||[]).some(function(js){ return js.toLowerCase() === ps.toLowerCase() || js.toLowerCase().indexOf(ps.toLowerCase()) > -1 || ps.toLowerCase().indexOf(js.toLowerCase()) > -1; })) {
                    if (matchedSkills.indexOf(ps) === -1) matchedSkills.push(ps);
                }
            });
        }
        if (matchedSkills.length > 0) {
            tagsHtml += matchedSkills.slice(0, 3).map(function(s){ return '<span class="jtag" style="border-color:var(--accent);color:var(--accent)">✓ ' + s + '</span>'; }).join('');
        }
        
        html += '<div class="job-card">' +
            '<div class="match-bar ' + lvlCls + '"></div>' +
            '<div class="job-body">' +
                '<div class="job-title-row">' +
                    '<span class="job-title">' + job.title + '</span>' +
                    '<span class="job-cat-badge" style="background:rgba(91,140,255,.12);color:#93bbfd">' + (catCfg.label.split(' ')[0]) + '</span>' +
                '</div>' +
                '<div class="job-meta">' +
                    '<span>🏢 ' + job.company + '</span>' +
                    '<span>📍 ' + job.city + '</span>' +
                    '<span>💰 ' + job.salary + '</span>' +
                    '<span>🎓 ' + job.edu + '</span>' +
                    '<span>⏱ ' + job.exp + '</span>' +
                '</div>' +
                '<div class="job-tags">' + tagsHtml + '</div>' +
                '<a class="go-btn" href="' + job.url + '" target="_blank" rel="noopener noreferrer">去投递 ↗</a>' +
            '</div>' +
            '<div class="job-score">' +
                '<div class="score-num" style="color:' + lvlColor + '">' + ms.score + '</div>' +
                '<div class="score-label">' + lvlLabel + '</div>' +
            '</div>' +
            '</div>';
    });
    
    list.innerHTML = html;
}

/* ═══════════════════════════════════════════
   DATA LOADING & POLLING
   ═══════════════════════════════════════════ */
function loadJobs(force) {
    setSync('loading', '正在拉取最新数据…');
    
    fetch(DATA_URL, { cache: force ? 'no-store' : 'default' })
        .then(function(r){
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(d){
            allJobs = d.jobs || [];
            
            // Populate filters
            populateFilters();
            
            // Update timestamp
            if (d.generatedAt) {
                setText('dataTs', d.generatedAt);
                setText('dataTsFooter', d.generatedAt);
            }
            
            // Check for changes
            var newSig = sigOf(allJobs);
            if (lastSig && newSig !== lastSig && allJobs.length > 0) {
                var added = 0;
                showToast('📢 已自动同步：岗位数据已更新');
            }
            lastSig = newSig;
            
            // Render
            renderJobs();
            setSync('ok', '已是最新 · ' + allJobs.length + ' 个职位');
        })
        .catch(function(e){
            console.error('Load error:', e);
            setSync('err', '离线模式（显示缓存数据）');
            if (allJobs.length === 0) {
                document.getElementById('jobList').innerHTML =
                    '<div class="empty-state"><div class="icon">⚠️</div><div>无法加载数据<br><span style="font-size:12px">请检查网络连接后点击「立即刷新」</span></div>';
            }
        });
}

function populateFilters() {
    var cats = {};
    var fields = {};
    allJobs.forEach(function(j){
        cats[j.category] = 1;
        fields[j.field] = 1;
    });
    
    var catSel = document.getElementById('catFilter');
    var curCat = catSel.value;
    catSel.innerHTML = '<option value="">全部类别 (' + Object.keys(cats).length + ')</option>';
    Object.keys(CAT_CONFIG).sort().forEach(function(c){
        if (cats[c]) {
            var opt = document.createElement('option');
            opt.value = c;
            opt.textContent = CAT_CONFIG[c].label;
            catSel.appendChild(opt);
        }
    });
    if (cats[curCat]) catSel.value = curCat;
    
    var fldSel = document.getElementById('fieldFilter');
    var curFld = fldSel.value;
    fldSel.innerHTML = '<option value="">全部领域 (' + Object.keys(fields).length + ')</option>';
    Object.keys(fields).sort().forEach(function(f){
        var opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f;
        fldSel.appendChild(opt);
    });
    if (fields[curFld]) fldSel.value = curFld;
}

function setSync(status, text) {
    var dot = document.getElementById('syncDot');
    dot.className = 'sync-dot ' + (status === 'loading' ? 'loading' : (status === 'ok' ? 'ok' : 'err'));
    document.getElementById('syncText').textContent = text;
}

function setText(id, txt) {
    var el = document.getElementById(id);
    if (el) el.textContent = txt;
}

function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 3500);
}

/* Version check (same as other pages) */
function checkVersion(){
    fetch('version.json', {cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('version.json not found');
        return r.json();
    }).then(function(d){
        document.getElementById('dataTs').textContent = d.ts || '—';
        document.getElementById('dataTsFooter').textContent = d.ts || '—';
    }).catch(function(){});
}

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
loadJobs(true);
checkVersion();
setInterval(loadJobs, POLL_INTERVAL);
setInterval(checkVersion, POLL_INTERVAL);

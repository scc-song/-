<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<script defer src="pdf.min.js"></script>
<script defer src="mammoth.browser.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResumeAuto · 简历编辑器</title>
<!-- 关键库本地自托管：避免依赖 jsDelivr（大陆常被墙/抽风，会导致页面白屏打不开）。中文字体回退系统字体（PingFang SC / 微软雅黑）。 -->
<link rel="stylesheet" href="resume.css" />
</head>
<body class="editor">
<header class="wb-topbar">
  <div class="brand">⚡ ResumeAuto <span class="sub">简历编辑器</span></div>
  <nav class="wb-nav">
    <a href="index.html">首页</a>
    <a href="templates.html">模板库</a>
  </nav>
  <div class="wb-tools">
    <label class="tctl">简历
      <select id="resumeSel" title="切换/管理多份简历"></select>
    </label>
    <button id="newResume" class="btn ghost">＋新简历</button>
    <button id="delResume" class="btn ghost" title="删除当前简历">🗑</button>
    <span class="sep"></span>
    <button id="saveResume" class="btn">💾 保存</button>
    <button id="aiPolishTop" class="btn accent" title="按 JD 一键润色（需在「内容→AI 润色」中配置 Key）">✨ AI 润色</button>
    <button id="exportPdf" class="btn">📄 导出PDF</button>
    <button id="exportJson" class="btn ghost">JSON</button>
    <button id="exportMd" class="btn ghost">MD</button>
    <button id="importJson" class="btn ghost" title="导入简历：支持 JSON / .docx / .pdf">导入</button>
    <input type="file" id="importFile" accept=".json,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf" hidden />
    <button id="resetBtn" class="btn ghost">重置</button>
  </div>
</header>

<main class="wb">
  <!-- 左侧：模板 / 内容 / 设计 -->
  <aside class="wb-side">
    <div class="wb-tabs">
      <button class="wb-tab active" data-tab="template">模板</button>
      <button class="wb-tab" data-tab="content">内容</button>
      <button class="wb-tab" data-tab="design">设计</button>
    </div>

    <!-- 模板画廊 -->
    <div class="wb-pane" id="pane-template">
      <div class="pane-hint">点击模板即可套用到右侧预览（内容保留，仅换样式与配色）。</div>
      <div class="tpl-gallery" id="tplGallery"></div>
    </div>

    <!-- 内容编辑 -->
    <div class="wb-pane" id="pane-content" hidden>
      <div id="basicsForm" class="card"></div>
      <div id="sections"></div>
      <div class="add-row">
        <select id="addType">
          <option value="experience">＋ 工作经历</option>
          <option value="education">＋ 教育背景</option>
          <option value="projects">＋ 项目经历</option>
          <option value="skills">＋ 技能特长</option>
          <option value="certificates">＋ 证书/资质</option>
          <option value="custom">＋ 自定义模块</option>
        </select>
        <button id="addSection" class="btn">添加模块</button>
      </div>

      <div class="card jd-card">
        <h2>① 岗位 JD 匹配</h2>
        <textarea id="jdInput" rows="5" placeholder="粘贴目标岗位的 JD / 招聘要求，自动计算匹配度并给出补充建议…"></textarea>
        <div class="row">
          <button id="analyzeJd" class="btn">分析匹配度</button>
          <span id="jdHint" class="hint"></span>
        </div>
        <div id="jdResult"></div>
      </div>

      <div class="card aux-card" id="auxCard">
        <h2>② 求职辅助</h2>
        <div class="row">
          <button id="genCover" class="btn">✉️ 生成求职信</button>
          <button id="genGap" class="btn ghost">📊 技能差距分析</button>
          <button id="copyCover" class="btn ghost" hidden>复制求职信</button>
        </div>
        <textarea id="coverOut" rows="8" placeholder="点击「生成求职信」自动按 JD + 当前简历拼装，可手动修改…"></textarea>
        <div id="gapResult"></div>
      </div>

      <div class="card ai-card" id="aiCard">
        <h2>③ AI 润色 <span class="hint">（用你自己的模型 Key，直连厂商、不经过中转）</span></h2>
        <div class="row">
          <button id="aiPolish" class="btn accent">✨ 按 JD 润色</button>
          <button id="aiSettingsBtn" class="btn ghost" title="配置 API">⚙️ 设置</button>
          <span id="aiStatus" class="hint"></span>
        </div>
        <div id="aiSettings" hidden>
          <div class="field"><label>API 地址（OpenAI 兼容）</label>
            <input id="aiBase" value="https://api.openai.com/v1" placeholder="https://api.openai.com/v1" /></div>
          <div class="field"><label>API Key</label>
            <input id="aiKey" type="password" placeholder="sk-... / 你的厂商密钥" autocomplete="off" /></div>
          <div class="field"><label>模型名</label>
            <input id="aiModel" value="gpt-4o-mini" placeholder="gpt-4o-mini / deepseek-chat" /></div>
          <p class="hint">浏览器直接请求模型厂商，不经过任何中转服务器；密钥仅存本机浏览器。建议在可信设备使用，并注意用量与费用。</p>
        </div>
      </div>
    </div>

    <!-- 设计微调 -->
    <div class="wb-pane" id="pane-design" hidden>
      <div class="card">
        <h2>当前模板</h2>
        <select id="tplSel" title="切换版式（内容不丢）">
          <option value="magic">Magic Resume 风</option>
          <option value="magicv">魔方时间轴（参考 magicv.art）</option>
          <option value="standard">统一标准模板</option>
          <option value="classic">经典单栏 · ATS</option>
          <option value="cn">清爽中文单栏</option>
          <option value="sidebar">双栏侧边</option>
          <option value="energy">新能源商务</option>
          <option value="cover">封面头图风</option>
          <option value="table">表格简历风</option>
          <option value="minimal">单色极简</option>
          <option value="exec">商务衬线</option>
          <option value="bold">色块标题</option>
          <option value="card">卡片模块</option>
          <option value="timeline">时间轴</option>
          <option value="grid">网格技能</option>
          <option value="soft">柔和圆角</option>
          <option value="compact">紧凑 ATS</option>
          <option value="stripe">斑马分区</option>
          <option value="corner">角标强调</option>
          <option value="aside-light">浅灰双栏</option>
          <option value="aside-dark">深色双栏</option>
        </select>
      </div>
      <div class="card">
        <h2>主题色</h2>
        <div class="design-row">
          <input type="color" id="accent" value="#E1251B" title="主题色" />
          <div class="theme-swatches" id="themeSwatches"></div>
        </div>
      </div>
      <div class="card">
        <h2>排版</h2>
        <div class="design-field"><label>字体</label>
          <select id="rsFont">
            <option value="">系统默认</option>
            <option value='"Microsoft YaHei","PingFang SC",sans-serif'>微软雅黑</option>
            <option value='"SimSun","Songti SC",serif'>宋体（衬线）</option>
            <option value='"Source Han Sans SC","Noto Sans SC",sans-serif'>思源黑体</option>
            <option value='Georgia,"Times New Roman",serif'>Georgia（英文）</option>
          </select>
        </div>
        <div class="design-field"><label>行高 <span class="val" id="rsLhVal"></span></label>
          <input type="range" id="rsLh" min="1.2" max="2" step="0.05" />
        </div>
        <div class="design-field"><label>基础字号 <span class="val" id="rsBaseVal"></span></label>
          <input type="range" id="rsBase" min="12" max="16" step="0.5" />
        </div>
        <div class="design-field"><label>模块标题字号 <span class="val" id="rsSecVal"></span></label>
          <input type="range" id="rsSec" min="13" max="20" step="0.5" />
        </div>
      </div>
      <div class="card">
        <h2>间距</h2>
        <div class="design-field"><label>页边距 <span class="val" id="rsMarginVal"></span></label>
          <input type="range" id="rsMargin" min="16" max="48" step="2" />
        </div>
        <div class="design-field"><label>模块间距 <span class="val" id="rsGapVal"></span></label>
          <input type="range" id="rsGap" min="8" max="32" step="2" />
        </div>
        <div class="design-field"><label>段落间距 <span class="val" id="rsParaVal"></span></label>
          <input type="range" id="rsPara" min="1" max="10" step="1" />
        </div>
      </div>
      <div class="card">
        <h2>模式</h2>
        <label class="design-check"><input type="checkbox" id="mIcon" /> 图标模式（标题前加竖条/圆点）</label>
        <label class="design-check"><input type="checkbox" id="mSubCenter" /> 副标题居中</label>
        <label class="design-check"><input type="checkbox" id="mLongTitle" /> 长标题模式（标题紧凑）</label>
      </div>
    </div>
  </aside>

  <!-- 右侧：实时预览 -->
  <section class="wb-preview">
    <div class="preview-bar">
      <span class="pv-title">实时预览</span>
      <span class="pv-scale" id="pvScale" title="自动缩放：简历内容超过一页时按比例缩小，以完整显示在预览区">100%</span>
      <span id="atsBadge" class="ats-badge" title="ATS 匹配度">—</span>
    </div>
    <div class="pv-scroll">
      <div class="pv-scaler" id="pvScaler">
        <div id="preview" class="resume-preview t-magic"></div>
      </div>
    </div>
  </section>
</main>

<script defer src="resume.js"></script>
</body>
</html>

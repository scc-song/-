name: Refresh jobs & SOE data

on:
  schedule:
    - cron: '0 */6 * * *'      # 每 6 小时自动刷新（UTC 0/6/12/18 点）
  workflow_dispatch:           # Actions 页面可手动 “Run workflow”

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run refresh script
        run: python scripts/refresh_data.py

      - name: Commit & push (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json soe.json version.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: auto-refresh jobs & SOE data"
            git push
          fi

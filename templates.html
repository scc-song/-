<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>简历模板库 · ResumeAuto</title>
<style>
  :root{
    --brand:#16a34a; --brand-d:#0f7a37; --bg:#f5f7f6; --card:#fff;
    --line:#e3e8e6; --text:#1f2a26; --muted:#6b7a73; --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5}
  header{padding:28px 20px 18px;max-width:1180px;margin:0 auto}
  h1{margin:0 0 6px;font-size:26px;display:flex;align-items:center;gap:10px}
  h1 .dot{width:12px;height:12px;border-radius:3px;background:var(--brand)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  .sub a{color:var(--brand-d)}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 14px;border-radius:999px;
    cursor:pointer;font-size:14px;transition:.15s}
  .tab:hover{border-color:var(--brand)}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .search{flex:1;min-width:180px;max-width:320px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none}
  .search:focus{border-color:var(--brand)}
  .count{color:var(--muted);font-size:13px;margin:6px 2px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;max-width:1180px;margin:0 auto;padding:0 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;transition:.15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.12)}
  .thumb{aspect-ratio:3/4;background:#eef1f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{color:var(--muted);font-size:13px}
  .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .name{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{display:inline-block;font-size:11px;color:var(--brand-d);background:#e7f5ec;border-radius:6px;padding:2px 7px;width:fit-content}
  .acts{display:flex;gap:8px;margin-top:auto}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:13px;padding:8px 6px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);transition:.15s}
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  footer{max-width:1180px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:40px}
  @media (max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>简历模板库</h1>
  <p class="sub">精选自开源项目 <a href="https://github.com/mmmlllnnn/ResumeCollection" target="_blank" rel="noopener">mmmlllnnn/ResumeCollection</a>（CC/公开授权）。预览图直链 GitHub，点击「下载 Word」获取可编辑原文件。</p>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <input class="search" id="search" placeholder="搜索模板名，如 免费 / 商务 / 研究生…" />
  </div>
  <div class="count" id="count"></div>
</header>
<main class="grid" id="grid"></main>
<div class="empty" id="empty" hidden>没有匹配的模板。</div>
<footer>
  所有模板版权归原作者所有，仅作格式参考与下载。ResumeAuto 不存储这些图片，预览均从源仓库实时加载。
</footer>

<script>
// 分类 key -> 编辑器内对应的 CSS 模板（resume.html?tpl=）
var TPL_MAP = {
  "中文简历": "cn",
  "EnglishResume": "classic",
  "多页简历": "sidebar",
  "简历封面": "cover",
  "简单表格简历": "table"
};
var manifest = null, activeCat = "all", kw = "";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

function buildTabs(){
  var tabs = document.getElementById('tabs');
  var cats = [{key:"all",label:"全部"}].concat(manifest.categories.map(function(c){return {key:c.key,label:c.label};}));
  tabs.innerHTML = '';
  cats.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'tab' + (c.key===activeCat?' on':'');
    b.textContent = c.label;
    b.onclick = function(){ activeCat = c.key; buildTabs(); render(); };
    tabs.appendChild(b);
  });
}

function allItems(){
  var out = [];
  manifest.categories.forEach(function(c){
    c.items.forEach(function(it){ out.push(Object.assign({catKey:c.key, catLabel:c.label}, it)); });
  });
  return out;
}

function render(){
  var grid = document.getElementById('grid');
  var items = allItems().filter(function(it){
    if(activeCat!=="all" && it.catKey!==activeCat) return false;
    if(kw && it.name.indexOf(kw)<0) return false;
    return true;
  });
  document.getElementById('count').textContent = '共 '+items.length+' 个模板';
  document.getElementById('empty').hidden = items.length>0;
  grid.innerHTML = '';
  items.forEach(function(it){
    var card = document.createElement('div'); card.className='card';
    var tpl = TPL_MAP[it.catKey] || 'classic';
    var thumb = it.preview
      ? '<div class="thumb"><img loading="lazy" src="'+esc(it.preview)+'" alt="'+esc(it.name)+'" onerror="this.parentNode.innerHTML=\'<div class=\\\"ph\\\">预览加载失败</div>\'"></div>'
      : '<div class="thumb"><div class="ph">无预览</div></div>';
    card.innerHTML =
      thumb +
      '<div class="body">'+
        '<span class="badge">'+esc(it.catLabel)+'</span>'+
        '<div class="name">'+esc(it.name)+'</div>'+
        '<div class="acts">'+
          '<a class="btn primary" href="resume.html?tpl='+encodeURIComponent(tpl)+'" target="_blank" rel="noopener">以此风格新建</a>'+
          '<a class="btn" href="'+esc(it.doc)+'" target="_blank" rel="noopener" download>下载 Word</a>'+
        '</div>'+
      '</div>';
    grid.appendChild(card);
  });
}

document.getElementById('search').addEventListener('input', function(e){ kw = e.target.value.trim(); render(); });

fetch('templates/manifest.json', {cache:'no-cache'})
  .then(function(r){ return r.json(); })
  .then(function(d){ manifest = d; buildTabs(); render(); })
  .catch(function(e){ document.getElementById('grid').innerHTML = '<div class="empty">清单加载失败：'+esc(e.message)+'<br>请确认 templates/manifest.json 已部署。</div>'; });
</script>
</body>
</html>
